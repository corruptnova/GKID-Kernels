name: NovaGKI Builder
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      TODO:
        description: To do
        default: "kernel"
        type: choice
        options:
          - "kernel"
          - "defconfig"

      TEST:
        description: debug the pipeline
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

      LTO:
        description: "LTO optimization (6.12 always builds without LTO, to match GKI's symbol checksums)"
        default: "fullLTO"
        type: choice
        options:
          - "noneLTO"
          - "thinLTO"
          - "fullLTO"

      KERNEL_VERSION:
        description: "GKI kernel line to build"
        default: "All"
        type: choice
        options:
          - "All"
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"

      CLEAN_LTO_CACHE:
        description: "Clean ThinLTO cache to fix .config bug"
        type: boolean
        default: true

      DROIDSPACES:
        description: "Enable droidspaces-oss support"
        type: boolean
        default: true

      NH:
        description: "Enable NetHunter support"
        type: boolean
        default: true

      NM:
        description: "Enable NoMount support"
        type: boolean
        default: false

      AUTOFDO:
        description: "Optimize with the AutoFDO profile shipped in the GKI tree (6.6 and 6.12)"
        type: boolean
        default: true

      HARDENING:
        description: "Apply KMI-safe security hardening (INIT_ON_FREE, kstack randomization, zero-call-used-regs)"
        type: boolean
        default: true

      STOCK_NAME:
        description: "Report a stock GKI style kernel release instead of the project name (-NovaGKI-rN-...)"
        type: boolean
        default: false

      STOCK_VERSION:
        description: "With STOCK_NAME: paste the stock kernel's 'Linux version ...' line to copy its release, builder, compiler and build date (or just a release suffix; empty = derive from source)"
        type: string
        default: ""

      PRERELEASE:
        description: "Publish as a pre-release (off: a full release marked Latest)"
        type: boolean
        default: true

env:
  MAN_DISABLE: true
  DEBIAN_FRONTEND: noninteractive

jobs:
  ensure-cache-release:
    name: Ensure ccache release exists
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Create persistent cache release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view ci-ccache-store --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "ci-ccache-store already exists"
          else
            echo "Creating ci-ccache-store release"
            gh release create ci-ccache-store \
              --repo "${{ github.repository }}" \
              --title "CI ccache store (internal - do not delete)" \
              --notes "Persistent compiler cache used by the build workflow. Each build matrix entry keeps one asset here (ccache-<variant>.tar.zst). Safe to delete if you want to force a cold cache for everything; the workflow recreates this release and rebuilds the caches automatically, just slower for the next run per variant." \
              --prerelease \
              --latest=false
          fi

  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Generate build matrix
        id: set-matrix
        env:
          # CI builds BakaSU + SUSFS and FinaSU + SUSFS for the selected GKI line(s).
          KERNEL_VERSION: ${{ github.event.inputs.KERNEL_VERSION }}
          BUILD_VANILLA: "false"
          BUILD_KSU: "false"
          BUILD_KSU_SUSFS: "true"
          BUILD_FSU_SUSFS: "true"
          VARIANTS: "BSU+SUSFS,FSU+SUSFS"
        run: |
          python3 py/generate-matrix.py >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each job downloads and uploads a multi-GB ccache archive on the same
      # release; running the whole matrix at once gets throttled by GitHub.
      max-parallel: 2
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdw-dev ccache gh bc bison flex libssl-dev libelf-dev dwarves cpio

      - name: Restore ccache from release
        if: github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        id: restore-ccache
        uses: ./.github/actions/ccache-restore
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Run Build Script
        env:
          GH_TOKEN: ${{ github.token }}
          KERNEL_VERSION: ${{ matrix.kernel_version }}
          KSU: ${{ matrix.KSU }}
          KSU_COMPAT: ${{ matrix.KSU_COMPAT }}
          KSU_SUSFS: ${{ matrix.KSU_SUSFS }}
          C_LTO: ${{ matrix.C_LTO }}
          No_DS: ${{ matrix.No_DS }}
          TODO: ${{ inputs.TODO }}
          TEST: ${{ inputs.TEST }}
          LTO: ${{ inputs.LTO }}
          CLEAN_LTO_CACHE: ${{ inputs.CLEAN_LTO_CACHE }}
          DROIDSPACES: ${{ inputs.DROIDSPACES }}
          NH: ${{ inputs.NH }}
          NM: ${{ inputs.NM }}
          AUTOFDO: ${{ inputs.AUTOFDO }}
          HARDENING: ${{ inputs.HARDENING }}
          STOCK_NAME: ${{ inputs.STOCK_NAME }}
          STOCK_VERSION: ${{ inputs.STOCK_VERSION }}
          BUILD_NAME: ${{ matrix.name }}
          RUN_NUM: -r${{ github.run_number }}
        run: |
          export GIT_CLONE_PROTECTION_ACTIVE=false
          chmod +x *.sh py/*.py
          ./build.sh

      - name: Create KernelSU module for wireless modules
        if: ${{ inputs.NH }}
        run: |
          echo "Extracting wireless modules..."
          NAME="WirelessKSU"
          WKSU="modules/$NAME"
          RPWD=$(pwd)
          mkdir -p "$WKSU/lkm"
          mkdir -p "$WKSU/system/etc/firmware/rtw88"

          for mod in rfkill cfg80211 mac80211 'rtw88*' r8188eu libarc4; do
            found=$(find out/ -iname "${mod}.ko" 2>/dev/null)
            if [ -n "$found" ]; then
              echo "$found" | xargs -I{} cp {} "$WKSU/lkm/"
            else
              echo "[-] $mod: no .ko found (not built or built-in)"
            fi
          done

          if [ -n "$(ls -A "$WKSU/lkm" 2>/dev/null)" ]; then
            sed -i "s/version=.*/version=${{ env.RELEASE }}-${{ matrix.kernel_version }}-${{ env.VARIANT }}/" "$WKSU/module.prop"
            cp ksrc/drivers/net/wireless/realtek/rtw88/firmware/* "$WKSU/system/etc/firmware/rtw88" 2>/dev/null || echo "[-] rtw88 firmware not found, skipping"
            echo "Modules found:"
            ls -la "$WKSU/lkm/"
            mkdir -p artifacts
            cd "$WKSU"
            zip -9 -r "$RPWD/artifacts/$NAME-${{ matrix.kernel_version }}-${{ env.VARIANT }}-${{ env.RELEASE }}.zip" .
            echo "$NAME-${{ matrix.kernel_version }}-${{ env.VARIANT }}-${{ env.RELEASE }}.zip created"
          else
            echo "No .ko files found (drivers may be built-in for this kernel version)"
          fi

      - name: ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Save ccache to release
        if: always() && github.event.inputs.TEST == 'no' && github.event.inputs.TODO != 'defconfig'
        uses: ./.github/actions/ccache-save
        with:
          repo: ${{ github.repository }}
          token: ${{ github.token }}
          variant: ${{ matrix.name }}

      - name: Save environment for release
        if: always()
        run: |
          cat > build-env-${{ matrix.name }}.txt << EOF
          RELEASE_REPO=${{ env.RELEASE_REPO }}
          KERNEL_NAME=${{ env.KERNEL_NAME }}
          RELEASE_NAME=${{ env.RELEASE_NAME }}
          RELEASE=${{ env.RELEASE }}
          LINUX_VERSION=${{ env.LINUX_VERSION }}
          COMPILER_STRING=${{ env.COMPILER_STRING }}
          SUSFS_VERSION=${{ env.SUSFS_VERSION }}
          BASE_NAME=${{ env.BASE_NAME }}
          KSU=${{ matrix.KSU }}
          KSU_SUSFS=${{ matrix.KSU_SUSFS }}
          KSU_COMPAT=${{ matrix.KSU_COMPAT }}
          No_DS=${{ matrix.No_DS }}
          VARIANT=${{ env.VARIANT }}
          BUILD_LTO=${{ env.BUILD_LTO }}
          KERNEL_VERSION=${{ env.KERNEL_VERSION }}
          ANDROID_RELEASE=${{ env.ANDROID_RELEASE }}
          KERNEL_SOURCE_REPO=${{ env.KERNEL_SOURCE_REPO }}
          KERNEL_SOURCE_BRANCH=${{ env.KERNEL_SOURCE_BRANCH }}
          EOF

          echo "BUILD_VARIANT=${{ matrix.name }}" >> build-env-${{ matrix.name }}.txt
          echo "Saved environment for ${{ matrix.name }}"

          if find . -name "*.rej" -type f | grep -q .; then
          mkdir -p rejected-patches-${{ matrix.name }}
          find . -name "*.rej" -type f -exec sh -c 'cp "$1" "rejected-patches-${{ matrix.name }}/$(echo "$1" | sed "s|^\./||; s|/|_|g")"' _ {} \;
          echo "Found $(find rejected-patches-${{ matrix.name }} -type f | wc -l) rejected patch files"
          else
            echo "No rejected patches found for ${{ matrix.name }}"
          fi

      - name: Upload environment file
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-env-${{ matrix.name }}-${{ github.run_number }}
          path: |
            build-env-${{ matrix.name }}.txt
            rejected-patches-${{ matrix.name }}/
          retention-days: 1

      - name: Upload build artifacts
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: build-${{ matrix.name }}-${{ github.run_number }}
          path: artifacts/
          retention-days: 1

  upload-all:
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: all-builds-${{ github.run_number }}
          retention-days: 7
          # merge-multiple extracts every build's files to the top of downloaded-artifacts/
          path: |
            downloaded-artifacts/*.txt
            downloaded-artifacts/*.zip

  release:
    needs: build
    if: always() && github.event.inputs.TODO != 'defconfig'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 1

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd release-artifacts
          sha256sum *.zip > checksums.txt
          md5sum *.zip > checksums-md5.txt

      - name: Load environment from builds and prepare release body
        env:
          TEST_INPUT: ${{ inputs.TEST }}
          DROIDSPACES_INPUT: ${{ inputs.DROIDSPACES }}
          NH_INPUT: ${{ inputs.NH }}
          NM_INPUT: ${{ inputs.NM }}
          LTO_INPUT: ${{ inputs.LTO }}
          AUTOFDO_INPUT: ${{ inputs.AUTOFDO }}
          HARDENING_INPUT: ${{ inputs.HARDENING }}
          STOCK_NAME_INPUT: ${{ inputs.STOCK_NAME }}
        run: python3 .github/scripts/prepare_release.py

      - name: Upload All Builds to release repo
        uses: softprops/action-gh-release@v3.0.2
        with:
          name: ${{ env.RELEASE_NAME }}
          tag_name: ${{ env.RELEASE }}
          # Tag the commit that was built, not the default branch's latest
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.PRERELEASE }}
          make_latest: ${{ inputs.PRERELEASE && 'false' || 'true' }}
          files: |
            release-artifacts/*.zip
            release-artifacts/checksums.txt
            release-artifacts/checksums-md5.txt
          body_path: release_body.md

