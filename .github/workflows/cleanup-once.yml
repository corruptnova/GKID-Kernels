name: One-off cleanup

# Temporary: deletes old build releases (with their tags) and finished
# workflow runs. Removed again right after it has run once.

on:
  push:
    branches:
      - claude/practical-hypatia-usiiry

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Delete old releases and finished workflow runs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      SELF_RUN: ${{ github.run_id }}
      HEAD_SHA: ${{ github.sha }}
      # GKID Builder #18 was still running when this was written; it is kept.
      KEEP_RUN: "43425490626"
    steps:
      - name: Delete build releases and their tags
        run: |
          set -uo pipefail
          fail=0
          # ci-ccache-store is deliberately not in this list.
          for tag in \
            v26.10.31-r1 v26.10.31-r2 \
            v26.11.02-r4 v26.11.02-r5 v26.11.02-r7 v26.11.02-r10 v26.11.02-r11 \
            v26.11.04-r12 v26.11.04-r13 v26.11.05-r14 \
            v26.11.12-r15 v26.11.13-r16 v26.11.13-r17
          do
            if gh release view "$tag" -R "$REPO" >/dev/null 2>&1; then
              if gh release delete "$tag" -R "$REPO" --yes --cleanup-tag; then
                echo "deleted release and tag $tag"
              else
                echo "::error::could not delete release $tag"
                fail=1
              fi
            else
              echo "no release for $tag"
            fi
            # Remove the tag if it is still there (release already gone).
            if gh api "repos/$REPO/git/ref/tags/$tag" >/dev/null 2>&1; then
              if gh api -X DELETE "repos/$REPO/git/refs/tags/$tag" >/dev/null; then
                echo "deleted leftover tag $tag"
              else
                echo "::error::could not delete tag $tag"
                fail=1
              fi
            fi
          done
          exit "$fail"

      - name: Delete finished workflow runs
        if: always()
        run: |
          set -uo pipefail
          fail=0

          delete_finished() {
            gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
              --jq '.workflow_runs[] | select(.status == "completed") | .id' > ids.txt
            while read -r id; do
              [ -z "$id" ] && continue
              [ "$id" = "$SELF_RUN" ] && continue
              [ "$id" = "$KEEP_RUN" ] && continue
              if gh api -X DELETE "repos/$REPO/actions/runs/$id" >/dev/null; then
                echo "deleted run $id"
              else
                echo "::error::could not delete run $id"
                fail=1
              fi
            done < ids.txt
          }

          delete_finished

          # The push that started this run also started other runs on the
          # same commit; wait for them to finish so they can be removed too.
          for _ in $(seq 1 40); do
            pending=$(gh api "repos/$REPO/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
              --jq "[.workflow_runs[] | select(.status != \"completed\" and .id != $SELF_RUN)] | length")
            [ "$pending" = "0" ] && break
            sleep 15
          done

          delete_finished
          exit "$fail"

      - name: Show what is left
        if: always()
        run: |
          echo "Releases:"
          gh release list -R "$REPO" --limit 100 || true
          echo "Tags:"
          gh api --paginate "repos/$REPO/tags?per_page=100" --jq '.[].name' || true
          echo "Workflow runs:"
          gh api --paginate "repos/$REPO/actions/runs?per_page=100" \
            --jq '.workflow_runs[] | "\(.id) \(.name) #\(.run_number) \(.status) \(.head_branch)"' || true
